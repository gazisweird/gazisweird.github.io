<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensaje por IP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
            font-size:24px;
        }
    </style>
</head>
<body>

<div id="mensaje">Cargando...</div>

<script>
async function obtenerDatos() {

    // API para IP + ciudad
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    const ip = data.ip;
    const ciudad = data.city || "tu ciudad";

    const mensajeDiv = document.getElementById("mensaje");

    // IPs dadas
    const ip1 = "190.2.118.195";
    const ip2 = "186.57.211.221";

    if (ip === ip1) {
        mensajeDiv.innerText = `Hola Ian! un gusto verte de nuevo 👀👀, hace calor en ${ciudad}`;
    } 
    else if (ip === ip2) {
        mensajeDiv.innerText = `Hola owner! un gusto verte de nuevo 👀👀, hace calor en ${ciudad}`;
    } 
    else {
        mensajeDiv.innerText = `Hola visitante! Estás entrando desde ${ciudad}`;
    }
}

obtenerDatos();
</script>

</body>
</html>
